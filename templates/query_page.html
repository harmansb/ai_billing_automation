<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Billing AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Prism.js for syntax highlighting -->
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-sql.min.js"></script>

    <style>
        #loadingSpinner {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body class="p-4">
    <h2 class="mb-4">🔍 Google Cloud Billing Query</h2>

    <form method="get" action="/ask" onsubmit="showSpinner()">
        <div class="mb-3">
            <label for="query" class="form-label">Enter your billing query:</label>
            <input type="text" id="query" name="query" class="form-control" value="{{ current_query or '' }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>

    <!-- Spinner -->
    <div id="loadingSpinner">
        <div class="spinner-border text-primary" role="status"></div>
        <div class="mt-2">Processing your query...</div>
    </div>

    {% if submitted_query %}
        <h4 class="mt-4">User Query:</h4>
        <p>{{ submitted_query }}</p>

        <h4 class="mt-3">Generated SQL:</h4>
        <pre class="language-sql"><code class="language-sql">{{ generated_sql }}</code></pre>
    {% endif %}

    {% if error_message %}
        <div class="alert alert-danger mt-3">{{ error_message }}</div>
    {% endif %}

    {% if query_results %}
        <h4 class="mt-4">Results:</h4>
        <div class="mb-2">
            <button onclick="downloadTableAsCSV()" class="btn btn-success btn-sm">⬇️ Download as CSV</button>
        </div>
        <div class="table-responsive" id="resultTable">
            {{ query_results | safe }}
        </div>
    {% endif %}

    <script>
        function showSpinner() {
            document.getElementById("loadingSpinner").style.display = "block";
        }

        function downloadTableAsCSV() {
            const table = document.querySelector("#resultTable table");
            if (!table) return;

            let csv = [];
            const rows = table.querySelectorAll("tr");

            rows.forEach(row => {
                const cols = row.querySelectorAll("th, td");
                const rowData = Array.from(cols).map(col => `"${col.innerText}"`);
                csv.push(rowData.join(","));
            });

            const blob = new Blob([csv.join("\n")], { type: "text/csv" });
            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = "billing_results.csv";
            a.click();

            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
